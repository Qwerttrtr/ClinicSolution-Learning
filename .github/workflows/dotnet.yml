name: Clinic Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Меняем ubuntu-latest на windows-latest, так как .NET Framework 4.8 работает только на Windows
    runs-on: windows-latest

    steps:
    # 1. Скачиваем код из репозитория (обновлено до актуальной версии v4)
    - uses: actions/checkout@v4

    # 2. Устанавливаем актуальный .NET SDK (Windows-раннер уже имеет встроенный .NET Framework 4.8)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x # Актуальная LTS-версия (вместо устаревшей 8.0)

    # 3. Восстанавливаем библиотеки
    - name: Restore dependencies
      run: dotnet restore

    # 4. Собираем проект
    - name: Build
      run: dotnet build --no-restore

    # 5. Запускаем тесты
    - name: Test
      run: dotnet test --no-build --verbosity normal
